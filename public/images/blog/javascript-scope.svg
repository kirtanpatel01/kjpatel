<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid lines overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" />
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" />
  </g>

  <!-- Global Scope Ring -->
  <circle cx="850" cy="315" r="240" fill="none" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <text x="850" y="95" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2" opacity="0.8">GLOBAL SCOPE</text>

  <!-- Function Scope Ring -->
  <circle cx="850" cy="315" r="160" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />
  <text x="850" y="175" fill="#c084fc" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2" opacity="0.9">FUNCTION SCOPE</text>

  <!-- Block Scope Ring -->
  <circle cx="850" cy="315" r="85" fill="url(#purpleGrad)" fill-opacity="0.15" stroke="url(#yellowGrad)" stroke-width="3" filter="url(#glow)" />
  <text x="850" y="250" fill="#fef08a" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="2" font-weight="bold">BLOCK SCOPE</text>

  <!-- Inner Variable badge -->
  <rect x="800" y="295" width="100" height="40" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
  <text x="850" y="320" fill="#fef08a" font-family="monospace" font-size="16" text-anchor="middle" font-weight="bold">let x = 42</text>

  <!-- Scope chain lookup arrows -->
  <path d="M850 290 V 225" stroke="#fef08a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2" />

  <!-- Code Snippet Card on Left -->
  <g transform="translate(100, 140)">
    <!-- Card Container -->
    <rect width="480" height="350" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />

    <!-- Window controls -->
    <circle cx="30" cy="28" r="6" fill="#ef4444" />
    <circle cx="50" cy="28" r="6" fill="#eab308" />
    <circle cx="70" cy="28" r="6" fill="#22c55e" />
    <text x="240" y="32" fill="#64748b" font-family="sans-serif" font-size="13" text-anchor="middle">lexical-scope.js</text>
    <line x1="0" y1="52" x2="480" y2="52" stroke="#1e293b" stroke-width="1" />

    <!-- Code Text -->
    <g font-family="monospace" font-size="15" font-weight="500">
      <!-- Line 1 -->
      <text x="30" y="90" fill="#94a3b8">const</text>
      <text x="80" y="90" fill="#38bdf8">globalVar</text>
      <text x="175" y="90" fill="#cbd5e1">=</text>
      <text x="195" y="90" fill="#fef08a">&quot;global&quot;</text>
      <text x="270" y="90" fill="#cbd5e1">;</text>

      <!-- Line 2 -->
      <text x="30" y="130" fill="#c084fc">function</text>
      <text x="110" y="130" fill="#60a5fa">outerFunction</text>
      <text x="235" y="130" fill="#cbd5e1">() {</text>

      <!-- Line 3 -->
      <text x="55" y="170" fill="#94a3b8">const</text>
      <text x="105" y="170" fill="#c084fc">outerVar</text>
      <text x="190" y="170" fill="#cbd5e1">=</text>
      <text x="210" y="170" fill="#fef08a">&quot;outer&quot;</text>
      <text x="280" y="170" fill="#cbd5e1">;</text>

      <!-- Line 4 -->
      <text x="55" y="210" fill="#64748b">// Accesses outer &amp; global</text>

      <!-- Line 5 -->
      <text x="55" y="250" fill="#f43f5e">console</text>
      <text x="120" y="250" fill="#cbd5e1">.</text>
      <text x="130" y="250" fill="#60a5fa">log</text>
      <text x="160" y="250" fill="#cbd5e1">(</text>
      <text x="170" y="250" fill="#38bdf8">globalVar</text>
      <text x="255" y="250" fill="#cbd5e1">,</text>
      <text x="270" y="250" fill="#c084fc">outerVar</text>
      <text x="350" y="250" fill="#cbd5e1">);</text>

      <!-- Line 6 -->
      <text x="30" y="290" fill="#cbd5e1">}</text>
    </g>
  </g>

  <!-- Title Badge Top Left -->
  <rect x="100" y="60" width="190" height="38" rx="20" fill="url(#yellowGrad)" fill-opacity="0.15" stroke="#eab308" stroke-width="1" />
  <text x="195" y="84" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JAVASCRIPT CORE</text>
</svg>
